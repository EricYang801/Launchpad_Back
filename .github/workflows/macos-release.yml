name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"

      - name: Build universal app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Launchpad_Back.xcodeproj \
            -scheme Launchpad_Back \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            | tail -n 20

      - name: Package
        run: |
          APP=build/Build/Products/Release/Launchpad_Back.app
          codesign --force --deep --sign - "$APP"
          # ditto keeps symlinks and extended attributes and puts only the .app at the zip root.
          ditto -c -k --keepParent "$APP" Launchpad_Back.app.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Launchpad_Back.app.zip
          generate_release_notes: true
